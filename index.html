<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        .btn-part1 { background-color: #4CAF50; color: white; }
        .btn-part1:hover { background-color: #45a049; }
        .btn-part2 { background-color: #2196F3; color: white; }
        .btn-part2:hover { background-color: #0b7dda; }
        
        .game-area {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .question-box {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #4CAF50;
            text-align: center;
            font-size: 20px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .question-box b {
            color: #d32f2f; /* 突顯加粗字體 */
        }
        input[type="text"] {
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-submit { background-color: #ff9800; color: white; flex: 1; }
        .btn-submit:hover { background-color: #e68a00; }
        .btn-next { background-color: #9e9e9e; color: white; flex: 1; display: none; }
        .btn-next:hover { background-color: #7d7d7d; }
        .btn-quit { background-color: #f44336; color: white; margin-top: 10px; }
        .btn-quit:hover { background-color: #da190b; }
        
        .feedback {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }

        .hint {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vocabulary Practice</h1>
    
    <!-- 選擇選單 -->
    <div id="menu" class="menu">
        <button class="btn-part1" onclick="startPart(1)">Part 1 (1 - 34題)<br><small>中英對譯練習</small></button>
        <button class="btn-part2" onclick="startPart(2)">Part 2 (35 - 68題)<br><small>看 Definition 填英文</small></button>
    </div>

    <!-- 遊戲區域 -->
    <div id="game" class="game-area">
        <div id="question" class="question-box"></div>
        <input type="text" id="answerInput" placeholder="請輸入答案..." autocomplete="off">
        <div class="action-buttons">
            <button class="btn-submit" id="submitBtn" onclick="checkAnswer()">檢查答案</button>
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()">下一題</button>
        </div>
        <div id="feedback" class="feedback"></div>
        <div class="hint" id="hint"></div>
        <button class="btn-quit" onclick="quitGame()">返回選單</button>
    </div>
</div>

<script>
    // Part 1 資料 (1-34)
    const part1Data = [
        { en: "gender", zh: "性別" },
        { en: "behavior", zh: "行為" },
        { en: "various", zh: "各式各樣的" },
        { en: "express", zh: "表達" },
        { en: "differ", zh: "不同" },
        { en: "throughout", zh: "在整個...期間" },
        { en: "across", zh: "橫跨" },
        { en: "despite", zh: "儘管" },
        { en: "employment", zh: "就業" },
        { en: "assertive", zh: "有主見的；果斷的" },
        { en: "similarity", zh: "相似性" },
        { en: "historically", zh: "歷史上" },
        { en: "position", zh: "地位；職位" },
        { en: "frequently", zh: "頻繁地" },
        { en: "value", zh: "價值 / 重視" },
        { en: "examine", zh: "審查" },
        { en: "ancient", zh: "古代的" },
        { en: "proverb", zh: "諺語" },
        { en: "consider", zh: "考慮" },
        { en: "society", zh: "社會" },
        { en: "century", zh: "世紀" },
        { en: "talkative", zh: "健談的；多話的" },
        { en: "weapon", zh: "武器" },
        { en: "rust", zh: "鏽 / 生鏽" },
        { en: "hen", zh: "母雞" },
        { en: "rooster", zh: "公雞" },
        { en: "myth", zh: "神話；迷思" },
        { en: "political", zh: "政治的" },
        { en: "economic", zh: "經濟的" },
        { en: "excessive", zh: "過度的" },
        { en: "prime minister", zh: "首相 / 總理" },
        { en: "president", zh: "總統" },
        { en: "complain", zh: "抱怨" },
        { en: "power", zh: "權力" }
    ];

    // Part 2 資料 (35-68)，已保留圖片中的加粗字體
    const part2Data = [
        { en: "profanity", def: "rude or offensive words, bad language" },
        { en: "sexism", def: "<b>gender bias</b> and unfairness, discrimination" },
        { en: "treatment", def: "the way you behave toward someone" },
        { en: "inferior", def: "<b>lower</b>, less important or powerful" },
        { en: "decade", def: "a period of <b>ten years</b>" },
        { en: "aware", def: "knowing about or <b>understanding</b> something" },
        { en: "politely", def: "respectfully, <b>nicely</b>" },
        { en: "directly", def: "in a clear and <b>straightforward</b> way without hiding" },
        { en: "for instance", def: "<b>for example</b>, such as" },
        { en: "identify", def: "to <b>recognize</b>" },
        { en: "rapport", def: "a <b>good relationship</b>, a connection" },
        { en: "weakness", def: "something that a person is <b>not good at</b>" },
        { en: "freely", def: "without being stopped or limited, <b>openly</b>" },
        { en: "in contrast", def: "<b>however</b>, on the other hand" },
        { en: "politics", def: "<b>government affairs</b>" },
        { en: "admit", def: "to <b>accept</b> or <b>confess</b> something is true" },
        { en: "linguist", def: "a <b>language expert</b>" },
        { en: "opportunity", def: "<b>chance</b>" },
        { en: "category", def: "a <b>group</b> or type of things that are similar" },
        { en: "scandal", def: "<b>shocking event</b>" },
        { en: "role", def: "the <b>position</b>, or <b>job</b> that someone has in a situation" },
        { en: "criticize", def: "to <b>find fault with</b> or say what is wrong or bad" },
        { en: "gossip", def: "<b>rumours</b> / to talk about others' lives or behaviours" },
        { en: "private", def: "<b>personal</b> and not meant to be known by everyone" },
        { en: "influence", def: "to <b>affect</b> how someone thinks" },
        { en: "barrier", def: "difficulty, <b>obstacle</b>" },
        { en: "dominate", def: "to have more <b>control</b> or power than others" },
        { en: "psychologist", def: "a person who studies how people <b>feel</b> and behave" },
        { en: "sexist", def: "<b>gender-biased</b>" },
        { en: "equality", def: "the state of having the same <b>rights</b>, fairness" },
        { en: "entirely", def: "<b>completely</b>, fully, or in every way" },
        { en: "military", def: "<b>army-related</b>" },
        { en: "originally", def: "<b>at first</b>, at the beginning" },
        { en: "scholarship", def: "a person who studies a subject at a <b>high level</b>" }
    ];

    let currentPart = 0;
    let currentQuestion = null;
    let questionType = ""; // 'zh-en', 'en-zh', or 'def-en'
    
    const menuDiv = document.getElementById('menu');
    const gameDiv = document.getElementById('game');
    const questionDiv = document.getElementById('question');
    const inputField = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackDiv = document.getElementById('feedback');
    const hintDiv = document.getElementById('hint');

    function startPart(part) {
        currentPart = part;
        menuDiv.style.display = 'none';
        gameDiv.style.display = 'flex';
        document.querySelector('.question-box').style.borderLeftColor = part === 1 ? '#4CAF50' : '#2196F3';
        nextQuestion();
    }

    function quitGame() {
        menuDiv.style.display = 'flex';
        gameDiv.style.display = 'none';
        feedbackDiv.textContent = "";
        inputField.value = "";
    }

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function nextQuestion() {
        feedbackDiv.textContent = "";
        feedbackDiv.className = "feedback";
        inputField.value = "";
        inputField.disabled = false;
        inputField.focus();
        submitBtn.style.display = 'block';
        nextBtn.style.display = 'none';
        hintDiv.textContent = "";

        if (currentPart === 1) {
            currentQuestion = getRandomItem(part1Data);
            // 80% 中 -> 英, 20% 英 -> 中
            const rand = Math.random();
            if (rand < 0.8) {
                questionType = 'zh-en';
                questionDiv.textContent = currentQuestion.zh;
                hintDiv.textContent = "請輸入英文單字";
            } else {
                questionType = 'en-zh';
                questionDiv.textContent = currentQuestion.en;
                hintDiv.textContent = "請輸入中文解釋";
            }
        } else {
            currentQuestion = getRandomItem(part2Data);
            questionType = 'def-en';
            questionDiv.innerHTML = currentQuestion.def; // 使用 innerHTML 以顯示 <b> 標籤
            hintDiv.textContent = "請輸入英文單字";
        }
    }

    function checkAnswer() {
        const userAnswer = inputField.value.trim().toLowerCase();
        if (!userAnswer) return;

        let correctAnswer = "";
        let isCorrect = false;

        if (questionType === 'zh-en') {
            correctAnswer = currentQuestion.en;
            // 允許一些微小容錯，例如空格差異
            isCorrect = userAnswer === correctAnswer.toLowerCase();
        } else if (questionType === 'en-zh') {
            correctAnswer = currentQuestion.zh;
            // 中文檢查，移除空格和標點符號進行比對
            const cleanUser = userAnswer.replace(/[\s,;\/]/g, '');
            const cleanCorrect = correctAnswer.replace(/[\s,;\/]/g, '');
            isCorrect = cleanUser === cleanCorrect;
        } else if (questionType === 'def-en') {
            correctAnswer = currentQuestion.en;
            isCorrect = userAnswer === correctAnswer.toLowerCase();
        }

        if (isCorrect) {
            feedbackDiv.textContent = "✅ 正確！";
            feedbackDiv.className = "feedback correct";
            inputField.disabled = true;
            showNextBtn();
        } else {
            feedbackDiv.innerHTML = `❌ 錯誤。正確答案是：<strong>${correctAnswer}</strong>`;
            feedbackDiv.className = "feedback incorrect";
            // 錯了不立刻給下一題，讓玩家看清楚答案，再點擊下一題
            showNextBtn();
        }
    }

    function showNextBtn() {
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'block';
        nextBtn.focus();
    }

    // 讓用戶可以按 Enter 鍵提交或進入下一題
    inputField.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            if (submitBtn.style.display !== 'none') {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }
    });
</script>

</body>
</html>
